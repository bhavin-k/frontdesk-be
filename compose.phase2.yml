name: recruitment-phase2
services:
  clamav:
    image: clamav/clamav:1.5.4@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a
    profiles:
      - scanner
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-signatures:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
  document-converter:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    command:
      - gotenberg
      - --api-disable-download-from=true
      - --api-body-limit=12MB
      - --api-timeout=60s
      - --chromium-disable-routes=true
      - --libreoffice-deny-list=.*
      - --webhook-disable=true
    networks:
      - conversion
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
      - /home/gotenberg:rw,nosuid,size=64m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
  conversion-gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "101:101"
    depends_on:
      - document-converter
    ports:
      - "127.0.0.1:8300:8080"
    volumes:
      - ./docker/document-converter-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - conversion
      - conversion-entrypoint
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m,uid=101,gid=101
      - /var/cache/nginx:rw,nosuid,size=16m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
networks:
  conversion:
    internal: true
  conversion-entrypoint:
volumes:
  clamav-signatures:
